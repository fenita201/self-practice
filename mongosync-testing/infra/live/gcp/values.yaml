# Gia tri cau hinh cho cac unit trong infra/live/gcp.
# Moi khoa cap 1 = ten folder cua unit; root.hcl tu lay block dung voi unit dang chay
# va truyen thanh `inputs` cho module. Sua o day roi `terragrunt plan` trong unit do de xem thay doi.
# ID / secret KHONG ghi o day: dung infra/.env (xem docs/02-gcp-infra.md §2.4).

project:
  create_project: false # true = Terraform tao project moi (can them billing_account)
  enable_apis:
    - compute.googleapis.com
    - iap.googleapis.com

vpc:
  subnets: # <ten subnet>: [CIDR chinh, CIDR phu...]
    mongo: ["10.20.0.0/24"] # VM source + VM destination
    sync: ["10.21.0.0/24"]  # VM chay mongosync
  static_nat_ip_enabled: true # IP NAT co dinh, de whitelist tren Atlas M0

firewall:
  # name duoc them prefix "<env>-"; network = lab-vpc.
  # source_subnets: ten subnet o tren, tu doi thanh CIDR.
  rules:
    - name: allow-ssh-iap
      source_ranges: ["35.235.240.0/20"] # dai IP cua Google IAP
      target_tags: ["allow-ssh"]
      protocol: tcp
      ports: ["22"]
      description: SSH via Google IAP
    - name: allow-mongodb-internal
      source_subnets: [mongo, sync]
      target_tags: ["allow-mongodb"]
      protocol: tcp
      ports: ["27017"]
      description: Replica set members, mongosync and tools inside the lab VPC
    - name: allow-icmp-internal
      source_subnets: [mongo, sync]
      target_tags: [] # rong = ap dung cho moi VM
      protocol: icmp
      ports: []
      description: Internal ping for debugging

key-pair:
  key_pair_name: mongosync-lab # => ~/.ssh/mongosync-lab(.pub)

src-vms: # cluster NGUON src-rs: lab-src-1..3
  platform: src
  subnet_name: mongo
  num_instances: 3
  internal_ips: ["10.20.0.11", "10.20.0.12", "10.20.0.13"]
  machine_type: e2-small # 2 GB RAM: du cho vai GB data test
  os_image: ubuntu-os-cloud/ubuntu-2204-lts
  boot_disk_size: 20
  boot_disk_type: pd-standard
  tags: ["allow-ssh", "allow-mongodb"]

dst-vms: # cluster DICH dst-rs: lab-dst-1..3 (chi huong A)
  platform: dst
  subnet_name: mongo
  num_instances: 3
  internal_ips: ["10.20.0.21", "10.20.0.22", "10.20.0.23"]
  machine_type: e2-medium # dich nen >= nguon: ghi initial copy + change event cung luc
  os_image: ubuntu-os-cloud/ubuntu-2204-lts
  boot_disk_size: 30
  boot_disk_type: pd-standard
  tags: ["allow-ssh", "allow-mongodb"]

sync-vm: # lab-sync-1: mongosync + tools
  platform: sync
  subnet_name: sync
  num_instances: 1
  internal_ips: ["10.21.0.10"]
  machine_type: e2-standard-4 # 16 GB: embedded verifier can >= ~11 GB; tat verifier co the dung e2-standard-2
  os_image: ubuntu-os-cloud/ubuntu-2404-lts-amd64
  boot_disk_size: 30
  boot_disk_type: pd-standard
  tags: ["allow-ssh"]
